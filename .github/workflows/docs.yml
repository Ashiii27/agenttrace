name: docs

on:
  workflow_dispatch:
  pull_request:
    paths: ["docs/**", "schema/**", "*.md", "mkdocs.yml", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "schema/**", "*.md", "mkdocs.yml", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --include-fragments "**/*.md"
          fail: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: check-jsonschema --check-metaschema schema/event.schema.json schema/checkpoint.schema.json
      - run: mkdocs build --strict
